<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Store Analytics</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#1c2b4a;--mu:#6b7794;--nav:#1f3864;--ac:#2f6fed;--bd:#dde3ee;--hv:#f4f7fc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#17223a;--tx:#e6ebf7;--mu:#93a1c2;--nav:#0a1020;--bd:#2a3856;--hv:#1d2b48}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#17223a;--tx:#e6ebf7;--mu:#93a1c2;--nav:#0a1020;--bd:#2a3856;--hv:#1d2b48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
nav{background:var(--nav);color:#fff;padding:18px 10px}
nav h1{font-size:17px;margin:0 8px 18px}
.nb{display:block;width:100%;text-align:left;background:none;border:0;color:#c9d4ee;padding:11px 12px;border-radius:9px;font:inherit;cursor:pointer;margin-bottom:4px}
.nb:hover{background:rgba(255,255,255,.1)}.nb.on{background:var(--ac);color:#fff;font-weight:600}
main{padding:16px 20px 28px;min-width:0}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
header h2{margin:0;font-size:22px}header small{color:var(--mu)}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fb label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:2px}
select,input,.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.btn{cursor:pointer}.btn:hover{background:var(--hv)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.k i{font-style:normal;font-size:26px;background:var(--hv);border-radius:10px;width:46px;height:46px;display:grid;place-items:center}
.k small{display:block;color:var(--mu)}.k b{font-size:22px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-bottom:12px}
@media(min-width:1000px){.w2{grid-column:span 2}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 8px;font-size:14px}.card h3 small{color:var(--mu);font-weight:400;margin-left:6px}
.cv{position:relative;height:300px}
.tm{display:flex;flex-wrap:wrap;gap:4px;height:300px;align-content:stretch;overflow:auto}
.tl{color:#fff;border-radius:6px;padding:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:70px;transition:opacity .2s,transform .15s}
.tl:hover{transform:scale(.98)}.tl.dim{opacity:.3}.tl span{opacity:.9;font-size:12px}
.tw{max-height:560px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd)}
th{cursor:pointer;color:var(--mu);font-size:12px;position:sticky;top:0;background:var(--card)}
td .bar{height:6px;border-radius:3px;background:var(--ac);margin-top:4px}
.dtw{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}.dc{min-width:210px;flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center}
.dn{position:relative;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;overflow:hidden}
.dn .db{position:absolute;left:0;top:0;bottom:0;background:var(--ac);opacity:.18}.dn span,.dn b{position:relative}
.dn.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.hint{color:var(--mu);margin:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{display:flex;gap:6px;overflow-x:auto;padding:10px}nav h1{display:none}.nb{white-space:nowrap;width:auto;margin:0}main{padding:12px}}
</style></head>
<body><div class="app">
<nav><h1>🛒 Online Store</h1>
<button class="nb" data-p="ex">📈 Executive overview</button>
<button class="nb" data-p="cu">👥 Customer insights</button>
<button class="nb" data-p="pr">📦 Product performance</button>
<button class="nb" data-p="fu">🔮 Future insights</button></nav>
<main>
<header><div><h2 id="t"></h2><small id="cnt"></small></div>
<div class="fb" id="fb"></div></header>
<div id="body"></div>
</main></div>
<input type="file" id="file" accept=".csv" hidden><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const MON="Jan,Feb,Mar,Apr,May,Jun,Jul,Aug,Sep,Oct,Nov,Dec".split(",");
const PAL=["#2f6fed","#16b3a5","#f2a33a","#e5566d","#8b6ff0","#5aa85a","#e07b39","#3aa6d8","#b5588f","#7a8a99","#c9a227","#4c9f70"];
const $=s=>document.querySelector(s),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const money=v=>Math.abs(v)>=1e6?"$"+(v/1e6).toFixed(2)+"M":Math.abs(v)>=1e3?"$"+(v/1e3).toFixed(1)+"K":"$"+Math.round(v);
const pct=v=>(v>=0?"+":"")+(v*100).toFixed(1)+"%",num=v=>Math.round(v).toLocaleString("en-US"),d1=v=>v.toFixed(1)+" d";
let Y0=2022,NM=48,ROWS=[],SRC="sample data",page="ex",lastR=[];
const ml=i=>MON[i%12]+" "+String(Y0+Math.floor(i/12)).slice(2),ql=i=>"Q"+(i%4+1)+" "+String(Y0+(i/4|0)).slice(2);
const mk=(d,sm,rg,st,cu,sg,pr,ca,sc,s,dd)=>({y:d.getFullYear(),mo:(d.getFullYear()-Y0)*12+d.getMonth(),sm,rg,st,cu,sg,pr,ca,sc,s,dd});

/* ---- demo data (same schema as the Power BI model: Orders / Customers / Products) ---- */
function sample(){
 let a=11;const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const G={West:["California","Washington","Oregon"],East:["New York","Pennsylvania","Massachusetts"],Central:["Texas","Illinois","Ohio"],South:["Florida","Georgia","North Carolina"]};
 const P={Furniture:{Chairs:[["Ergonomic Chair",340],["Task Chair",160]],Tables:[["Conference Table",520],["Side Table",140]],Bookcases:[["Oak Bookcase",260],["Corner Shelf",120]]},
 "Office Supplies":{Binders:[["Heavy-Duty Binder",24],["Ring Binder Set",38]],Paper:[["Copy Paper Case",46],["Premium Paper",32]],Storage:[["File Cabinet",190],["Storage Box",42]]},
 Technology:{Phones:[["Smartphone X",640],["Desk Phone",130]],Accessories:[["Wireless Mouse",36],["Keyboard Pro",85]],Copiers:[["Laser Copier",980],["Mini Copier",410]]}};
 const pr=[];for(const c in P)for(const s in P[c])P[c][s].forEach(([n,p])=>pr.push({n,c,s,p}));
 const rg=Object.keys(G),SM=[["Standard Class",.6,5,8],["Second Class",.19,3,5],["First Class",.15,2,3],["Same Day",.06,0,1]];
 const cu=[];for(let i=0;i<380;i++){const u=r(),g=rg[Math.floor(r()*4)];cu.push({id:"C-"+(1000+i),sg:u<.52?"Consumer":u<.82?"Corporate":"Home Office",rg:g,st:G[g][Math.floor(r()*3)]})}
 const o=[];Y0=2022;
 for(let i=0;i<3800;i++){const d=new Date(2022,0,1+Math.floor(1461*Math.pow(r(),.82))),c=cu[Math.floor(r()*cu.length)],p=pr[Math.floor(r()*pr.length)];
  let u=r(),m=SM[0];for(const x of SM){if(u<x[1]){m=x;break}u-=x[1]}
  o.push(mk(d,m[0],c.rg,c.st,c.id,c.sg,p.n,p.c,p.s,p.p*(1+Math.floor(r()*4))*(.85+r()*.3)*(d.getMonth()>=9?1.15:1),m[2]+Math.round(r()*(m[3]-m[2]))))}
 return o}

/* ---- state, filters, measures ---- */
const F={rg:"",st:"",sm:"",sg:"",ca:"",sc:""},FL={rg:"Region",st:"State",sm:"Ship mode",sg:"Segment",ca:"Category",sc:"Sub-category"};
const rows=()=>ROWS.filter(r=>Object.keys(F).every(k=>!F[k]||r[k]===F[k]));
function grp(R,k,sort=true){const m=new Map();for(const r of R){const key=r[k];let g=m.get(key);if(!g)m.set(key,g={k:key,s:0,n:0,c:new Set(),d:0});g.s+=r.s;g.n++;g.c.add(r.cu);g.d+=r.dd}const a=[...m.values()];return sort?a.sort((x,y)=>y.s-x.s):a}
function mser(R){const s=Array(NM).fill(0),c=Array.from({length:NM},()=>new Set());R.forEach(r=>{s[r.mo]+=r.s;c[r.mo].add(r.cu)});return{s,c:c.map(x=>x.size)}}
function K(R){const s=R.reduce((a,r)=>a+r.s,0),n=R.length,c=new Set(R.map(r=>r.cu)).size,p=new Set(R.map(r=>r.pr)).size,ct=new Set(R.map(r=>r.ca)).size,ly=R.reduce((a,r)=>Math.max(a,r.y),0);
 const a=R.filter(r=>r.y==ly).reduce((x,r)=>x+r.s,0),b=R.filter(r=>r.y==ly-1).reduce((x,r)=>x+r.s,0);
 return{s,n,c,p,ct,aov:n?s/n:0,rpc:c?s/c:0,avp:p?s/p:0,dd:n?R.reduce((x,r)=>x+r.dd,0)/n:0,yoy:b?(a-b)/b:null}}
const KD={s:["Total Sales",k=>money(k.s),"💰"],n:["Total Orders",k=>num(k.n),"🛒"],c:["Total Customers",k=>num(k.c),"👥"],aov:["Avg Order Value",k=>money(k.aov),"🧾"],yoy:["YoY Growth",k=>k.yoy==null?"–":pct(k.yoy),"📈"],rpc:["Revenue / Customer",k=>money(k.rpc),"💵"],dd:["Avg Delivery Days",k=>k.dd.toFixed(1),"🚚"],p:["Total Products",k=>num(k.p),"📦"],ct:["Total Categories",k=>k.ct,"🗂️"],avp:["Avg Product Value",k=>money(k.avp),"🏷️"]};

/* ---- chart helpers (click any bar, slice or tile to cross-filter) ---- */
const CH={};
const toggle=(k,v)=>{F[k]=F[k]===v?"":v;sync();upd()};
const pk=k=>(e,el,c)=>{if(el.length)toggle(k,c.data.labels[el[0].index])};
const cols=(l,k)=>l.map((x,i)=>PAL[i%PAL.length]+(F[k]&&F[k]!==x?"44":""));
function ch(id,type,labels,sets,o={}){
 if(CH[id])CH[id].destroy();const tc=css("--mu"),f=o.fmt||money;
 CH[id]=new Chart($("#"+id),{type,data:{labels,datasets:sets},options:{responsive:true,maintainAspectRatio:false,animation:{duration:350},onClick:o.click,interaction:{mode:type=="doughnut"?"nearest":"index",intersect:type=="doughnut"},
 plugins:{legend:{display:sets.length>1||type=="doughnut",position:"bottom",labels:{color:tc,boxWidth:10}},tooltip:{callbacks:{label:c=>(c.dataset.label?c.dataset.label+": ":c.label+": ")+f(c.parsed.y??c.parsed)}}},
 scales:type=="doughnut"?{}:{x:{stacked:!!o.st,ticks:{color:tc,maxTicksLimit:12},grid:{display:false}},y:{stacked:!!o.st,beginAtZero:true,ticks:{color:tc,callback:v=>f(v)},grid:{color:css("--bd")}}}}})}
function bar(id,R,key,lab,metric="s",fmt=money){const g=grp(R,key).map(x=>({k:x.k,v:metric=="n"?x.n:x.s}));
 ch(id,"bar",g.map(x=>x.k),[{label:lab,data:g.map(x=>x.v),backgroundColor:cols(g.map(x=>x.k),key),borderRadius:5}],{click:pk(key),fmt})}
function dn(id,R,key){const g=grp(R,key);ch(id,"doughnut",g.map(x=>x.k),[{data:g.map(x=>x.s),backgroundColor:cols(g.map(x=>x.k),key),borderWidth:0}],{click:pk(key)})}
function tm(id,items,key){const tot=items.reduce((a,x)=>a+x.s,0)||1,e=$("#"+id);
 e.innerHTML=items.map((x,i)=>`<div class="tl${F[key]&&F[key]!=x.k?" dim":""}" data-k="${x.k}" style="flex:${x.s} 1 ${Math.max(x.s/tot*100,12)}%;background:${PAL[(x.i??i)%PAL.length]}"><b>${x.k}</b><span>${money(x.s)}</span></div>`).join("");
 e.onclick=ev=>{const t=ev.target.closest(".tl");if(t)toggle(key,t.dataset.k)}}
const card=(t,id,x="",tm="")=>`<div class="card ${x}"><h3>${t}</h3>${tm?`<div class="tm" id="${id}"></div>`:`<div class="cv"><canvas id="${id}"></canvas></div>`}</div>`;
const byQ=(R,key,f)=>{const nq=Math.ceil(NM/3);return[...new Set(R.map(r=>r[key]))].sort().map((c,i)=>{const a=Array(nq).fill(0),n=Array(nq).fill(0);R.forEach(r=>{if(r[key]==c){a[r.mo/3|0]+=f(r);n[r.mo/3|0]++}});return{label:c,a,n,i}})};

/* ---- pages ---- */
const T={k:"s",dir:-1,q:""},D={ca:"",sc:""},H={n:6};
const PG={
ex:{t:"Executive overview",k:["s","n","c","aov","yoy"],
 h:`<div class="g">${card("Sales by month <small>bars · 3-month average</small>","c1","w2")}${card("Sales by category","c2")}</div><div class="g">${card("Sales by region","c3")}${card("Quarterly sales by category","c4")}${card("Orders by ship mode","c5")}</div>`,
 u(R){const m=mser(R),ma=m.s.map((_,i)=>{const a=m.s.slice(Math.max(0,i-2),i+1);return a.reduce((x,y)=>x+y,0)/a.length});
  ch("c1","bar",m.s.map((_,i)=>ml(i)),[{label:"Sales",data:m.s,backgroundColor:PAL[0]+"cc",borderRadius:3},{type:"line",label:"3-mo avg",data:ma,borderColor:PAL[2],pointRadius:0,tension:.3,borderWidth:2.5}]);
  dn("c2",R,"ca");bar("c3",R,"rg","Sales");
  const q=byQ(R,"ca",r=>r.s);ch("c4","line",q[0]?q[0].a.map((_,i)=>ql(i)):[],q.map(x=>({label:x.label,data:x.a,fill:true,backgroundColor:PAL[x.i]+"99",borderColor:PAL[x.i],tension:.3,pointRadius:0})),{st:1});
  bar("c5",R,"sm","Orders","n",num)}},
cu:{t:"Customer insights",k:["s","c","rpc","aov","dd"],
 h:`<div class="g">${card("Sales by segment","c1")}${card("Sales by state <small>click a tile</small>","c2","w2","tm")}</div><div class="g">${card("Avg delivery days by ship mode","c3","w2")}${card("Sales by ship mode","c4")}</div><div class="g">${card("Orders by ship mode","c5")}</div>`,
 u(R){bar("c1",R,"sg","Sales");tm("c2",grp(R,"st"),"st");
  const q=byQ(R,"sm",r=>r.dd);ch("c3","line",q[0]?q[0].a.map((_,i)=>ql(i)):[],q.map(x=>({label:x.label,data:x.a.map((v,i)=>x.n[i]?v/x.n[i]:null),fill:true,backgroundColor:PAL[x.i]+"33",borderColor:PAL[x.i],tension:.3,pointRadius:2,spanGaps:true})),{fmt:d1});
  dn("c4",R,"sm");bar("c5",R,"sm","Orders","n",num)}},
pr:{t:"Product performance",k:["s","p","ct","avp"],
 h:`<div class="g"><div class="card w2"><h3>Product ranking <small>click a header to sort</small></h3><input id="q" placeholder="Search products…" style="margin-bottom:8px;width:100%"><div class="tw"><table><thead><tr><th data-k="rk">Rank</th><th data-k="k">Product</th><th data-k="s">Total sales</th></tr></thead><tbody id="tb"></tbody></table></div></div><div>${card("Sales by sub-category","c1")}<div style="height:12px"></div>${card("Sales by category","c2")}</div></div><div class="g">${card("Category &amp; sub-category <small>click a tile</small>","c3","","tm")}</div>`,
 i(){$("#q").value=T.q;$("#q").oninput=e=>{T.q=e.target.value.toLowerCase();tb()};document.querySelector("thead").onclick=e=>{const k=e.target.dataset.k;if(!k)return;T.dir=T.k==k?-T.dir:(k=="k"||k=="rk"?1:-1);T.k=k;tb()}},
 u(R){bar("c1",R,"sc","Sales");dn("c2",R,"ca");const cs=[...new Set(R.map(r=>r.ca))].sort();tm("c3",grp(R,"sc").map(x=>({...x,i:cs.indexOf(R.find(r=>r.sc==x.k).ca)})),"sc");tb()}},
fu:{t:"Future insights",k:["s","rpc","yoy"],
 h:`<div class="g">${card("Sales trend &amp; forecast <small id='fx'></small>","c1","w2")}${card("Revenue per customer by month","c2")}</div><div class="card"><h3>Sales breakdown <small>click a category to drill down</small></h3><div class="dtw" id="dt"></div></div>`,
 u(R){const m=mser(R),n=NM,y=m.s,mx=(n-1)/2,my=y.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0;y.forEach((v,i)=>{sxy+=(i-mx)*(v-my);sxx+=(i-mx)**2});
  const b=sxx?sxy/sxx:0,a=my-b*mx,f=i=>Math.max(0,a+b*i),L=Array.from({length:n+H.n},(_,i)=>ml(i)),fc=L.map((_,i)=>i<n-1?null:i==n-1?y[i]:f(i));
  ch("c1","line",L,[{label:"Actual",data:L.map((_,i)=>i<n?y[i]:null),borderColor:PAL[0],backgroundColor:PAL[0]+"22",fill:true,tension:.3,pointRadius:0,borderWidth:2.5},{label:"Forecast (linear trend)",data:fc,borderColor:PAL[2],borderDash:[6,4],tension:.3,pointRadius:0,borderWidth:2.5}]);
  const tot=fc.slice(n).reduce((x,v)=>x+v,0);$("#fx").innerHTML=`next <select id="hz" style="padding:2px 4px">${[3,6,12].map(v=>`<option${v==H.n?" selected":""}>${v}</option>`).join("")}</select> months ≈ ${money(tot)}`;
  $("#hz").onchange=e=>{H.n=+e.target.value;upd()};
  ch("c2","line",y.map((_,i)=>ml(i)),[{label:"Revenue / customer",data:y.map((v,i)=>m.c[i]?v/m.c[i]:null),borderColor:PAL[1],backgroundColor:PAL[1]+"22",fill:true,tension:.3,pointRadius:0,spanGaps:true}]);dt(R)}}};

function tb(){let a=grp(lastR,"pr");a.forEach((x,i)=>x.rk=i+1);const mx=a[0]?a[0].s:1;
 if(T.q)a=a.filter(x=>x.k.toLowerCase().includes(T.q));
 a.sort((x,y)=>T.dir*(typeof x[T.k]=="string"?x[T.k].localeCompare(y[T.k]):x[T.k]-y[T.k]));
 $("#tb").innerHTML=a.slice(0,300).map(x=>`<tr><td>#${x.rk}</td><td>${x.k}</td><td>${money(x.s)}<div class="bar" style="width:${x.s/mx*100}%"></div></td></tr>`).join("")||`<tr><td colspan=3>No products match.</td></tr>`}
function dt(R){const ca=grp(R,"ca"),tot=R.reduce((a,r)=>a+r.s,0);if(D.ca&&!ca.some(x=>x.k==D.ca))D.ca="";
 const sub=D.ca?grp(R.filter(r=>r.ca==D.ca),"sc"):[],col=(it,sel,l)=>it.map(x=>`<div class="dn${sel==x.k?" on":""}" data-l="${l}" data-k="${x.k}"><div class="db" style="width:${x.s/it[0].s*100}%"></div><span>${x.k}</span><b>${money(x.s)}</b></div>`).join("");
 $("#dt").innerHTML=`<div class="dc"><div class="dn on"><span>Total Sales</span><b>${money(tot)}</b></div></div><div class="dc">${col(ca,D.ca,1)}</div><div class="dc">${D.ca?col(sub,D.sc,2):'<p class="hint">Select a category to drill down</p>'}</div>`;
 $("#dt").onclick=e=>{const n=e.target.closest(".dn");if(!n||!n.dataset.l)return;if(n.dataset.l==1){D.ca=D.ca==n.dataset.k?"":n.dataset.k;D.sc=""}else D.sc=D.sc==n.dataset.k?"":n.dataset.k;dt(lastR)}}

/* ---- shell ---- */
function show(p){page=p;document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on",b.dataset.p==p));$("#t").textContent=PG[p].t;
 $("#body").innerHTML=`<div class="kp">${PG[p].k.map(k=>`<div class="k"><i>${KD[k][2]}</i><div><small>${KD[k][0]}</small><b id="k_${k}"></b></div></div>`).join("")}</div>`+PG[p].h;
 Object.keys(CH).forEach(k=>{CH[k].destroy();delete CH[k]});if(PG[p].i)PG[p].i();upd()}
function upd(){const R=rows();lastR=R;const k=K(R);PG[page].k.forEach(x=>$("#k_"+x).textContent=KD[x][1](k));
 const on=Object.keys(F).filter(x=>F[x]).length;$("#cnt").textContent=`${num(R.length)} of ${num(ROWS.length)} orders · ${SRC}${on?" · "+on+" filter"+(on>1?"s":""):""}`;PG[page].u(R)}
function sync(){for(const k in F)$("#f_"+k).value=F[k]}
function build(){$("#fb").innerHTML=Object.keys(FL).map(k=>`<label>${FL[k]}<select id="f_${k}"><option value="">All</option>${[...new Set(ROWS.map(r=>r[k]))].sort().map(v=>`<option>${v}</option>`).join("")}</select></label>`).join("")+
