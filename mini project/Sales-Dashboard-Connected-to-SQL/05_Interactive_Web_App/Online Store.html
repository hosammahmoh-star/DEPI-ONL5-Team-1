<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OnlineStoreDB - Ultimate Analytics Dashboard & AI Assistant</title>
    <!-- Chart.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <!-- Tailwind CSS CDN (for AI Chat UI) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS for Excel & CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0e1524;
            --card: #17223a;
            --tx: #e6ebf7;
            --mu: #93a1c2;
            --nav: #0a1020;
            --ac: #4318ff;
            --bd: #2a3856;
            --hv: #1d2b48;
        }
        :root[data-theme="light"] {
            --bg: #f4f7fe;
            --card: #ffffff;
            --tx: #2b3674;
            --mu: #7090b0;
            --nav: #1f3864;
            --ac: #4318ff;
            --bd: #e9ecef;
            --hv: #f4f7fc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--tx); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
        
        /* Sidebar */
        nav { background: var(--nav); color: #fff; padding: 20px 15px; display: flex; flex-direction: column; gap: 6px; box-shadow: 2px 0 15px rgba(0,0,0,0.1); position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 10; }
        nav h1 { font-size: 18px; margin: 0 5px 20px; color: #fff; font-weight: 800; text-align: center; }
        .nb { display: block; width: 100%; text-align: right; background: none; border: 0; color: #c9d4ee; padding: 12px 14px; border-radius: 10px; font: inherit; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        [dir="ltr"] .nb { text-align: left; }
        .nb:hover { background: rgba(255,255,255,0.1); }
        .nb.on { background: var(--ac); color: #fff; }

        /* Main */
        main { padding: 20px 25px; min-width: 0; overflow-y: auto; }
        header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; background: var(--card); padding: 18px 24px; border-radius: 16px; border: 1px solid var(--bd); }
        header h2 { margin: 0; font-size: 22px; color: var(--tx); }
        .fb { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        
        select, input, .btn { font: inherit; color: var(--tx); background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 8px 12px; outline: none; transition: 0.2s; }
        .btn { cursor: pointer; font-weight: 600; }
        .btn:hover { background: var(--hv); }
        .btn.p { background: var(--ac); border-color: var(--ac); color: #fff; }

        /* KPI Grid */
        .kp { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .k { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: 0px 10px 30px rgba(0,0,0,0.05); }
        .k i { font-style: normal; font-size: 24px; background: var(--hv); border-radius: 10px; width: 48px; height: 48px; display: grid; place-items: center; }
        .k small { display: block; color: var(--mu); font-size: 12px; margin-bottom: 4px; }
        .k b { font-size: 18px; color: var(--tx); }

        /* Charts Grid */
        .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; margin-bottom: 18px; }
        @media(min-width: 1100px) { .w2 { grid-column: span 2; } }
        .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 18px; box-shadow: 0px 10px 30px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 12px; font-size: 15px; color: var(--tx); display: flex; justify-content: space-between; align-items: center; }
        .cv { position: relative; height: 300px; width: 100%; }

        /* Analysis & Pipeline */
        .analysis-section, .pipeline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        .analysis-card, .pipeline-card { background: var(--card); border: 1px solid var(--bd); padding: 22px; border-radius: 14px; border-right: 4px solid var(--ac); box-shadow: 0px 10px 30px rgba(0,0,0,0.05); }
        [dir="ltr"] .analysis-card, [dir="ltr"] .pipeline-card { border-right: none; border-left: 4px solid var(--ac); }
        .analysis-card h3, .pipeline-card h3 { font-size: 16px; color: var(--ac); margin-bottom: 10px; }
        .analysis-card ul { padding-inline-start: 20px; color: var(--mu); font-size: 13px; line-height: 1.7; }
        .analysis-card li { margin-bottom: 6px; }
        .pipeline-card p { font-size: 13px; color: var(--mu); line-height: 1.6; margin-bottom: 8px; }
        .pipeline-card code { background: var(--hv); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #e5566d; }

        @media(max-width: 800px) {
            .app { grid-template-columns: 1fr; }
            nav { flex-direction: row; overflow-x: auto; padding: 10px; align-items: center; height: auto; position: static; }
            nav h1 { display: none; }
            .nb { white-space: nowrap; width: auto; }
            main { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Sidebar Navigation -->
    <nav>
        <h1 id="brandTitle">🛒 OnlineStoreDB</h1>

        <button class="nb" data-p="analysis" id="navAna">📈 التحليلات والمشاكل والحلول</button>

let CH = {};
function ch(id, type, labels, sets, opts = {}) {
    if (CH[id]) CH[id].destroy();
    const tc = getComputedStyle(document.documentElement).getPropertyValue('--mu').trim();
    CH[id] = new Chart(document.getElementById(id), {
        type, data: { labels, datasets: sets },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: tc, boxWidth: 10 } } },
            scales: type === 'doughnut' || type === 'pie' ? {} : { x: { ticks: { color: tc }, grid: { display: false } }, y: { ticks: { color: tc, callback: v => "$"+Math.round(v).toLocaleString() }, grid: { color: 'rgba(200,200,200,0.1)' } } }
        }
    });
}

function switchPage(p) { 
    activePage = p; 
    document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.p === p)); 
    renderUI(); 
}

function toggleLang() { 
    currentLang = currentLang === 'ar' ? 'en' : 'ar'; 
    renderUI(); 
}

function toggleTheme() { 
    const root = document.documentElement; 
    root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); 
    renderUI(); 
}

// AI Assistant Data Fetching & Handling
function initAIAssistant() {
    const defaultPaths = [
        '../01_Python_Cleaning/train_cleaned.csv',
        '../02_python_processing/train_cleaned.csv',
        'https://raw.githubusercontent.com/hosammahmoh-star/DEPI-ONL5-Team-1/main/mini%20project/Sales-Dashboard-Connected-to-SQL/01_Python_Cleaning/train_cleaned.csv',
        'https://raw.githubusercontent.com/hosammahmoh-star/DEPI-ONL5-Team-1/main/mini%20project/Sales-Dashboard-Connected-to-SQL/02_python_processing/train_cleaned.csv',
        'train_cleaned.csv'
    ];
    tryFetchDefaultData(defaultPaths, 0);

    const fileInput = document.getElementById('file-input');
    if(fileInput) {
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            if (file.name.endsWith('.csv')) {
                reader.onload = function(event) { processData(event.target.result); };
                reader.readAsText(file);
            } else {
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const csvData = XLSX.utils.sheet_to_csv(worksheet);
                    processData(csvData);
                };
                reader.readAsArrayBuffer(file);
            }
        });
    }
}

function tryFetchDefaultData(paths, index) {
    if (index >= paths.length) {
        const badge = document.getElementById('status-badge');
        if(badge) {
            badge.textContent = "في انتظار رفع الملف يدوياً 📁";
            badge.className = "px-3 py-1 bg-amber-500/20 text-amber-300 text-xs rounded-full border border-amber-500/30";
        }
        return;
    }
    fetch(paths[index])
        .then(response => {
            if (!response.ok) throw new Error("File not found");
            return response.text();
        })
        .then(csvText => {
            processData(csvText);
            const badge = document.getElementById('status-badge');
            if(badge) {
                badge.textContent = `تم تحميل بيانات جيثب تلقائياً (${totalRowCount.toLocaleString()} صف) ✅`;
                badge.className = "px-3 py-1 bg-emerald-500/20 text-emerald-300 text-xs rounded-full border border-emerald-500/30";
            }
        })
        .catch(() => {
            tryFetchDefaultData(paths, index + 1);
        });
}

function processData(csvText) {
    const lines = csvText.trim().split('\n');
    globalColumns = lines[0];
    totalRowCount = lines.length - 1;
    globalDataSummary = csvText;

    const badge = document.getElementById('status-badge');
    if(badge) {
        badge.textContent = `تم تحميل البيانات (${totalRowCount.toLocaleString()} صف) ✅`;
        badge.className = "px-3 py-1 bg-emerald-500/20 text-emerald-300 text-xs rounded-full border border-emerald-500/30";
    }

    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    if(userInput) userInput.disabled = false;
    if(sendBtn) sendBtn.disabled = false;

    appendMessage("النظام", `تم قراءة الملف بنجاح! إجمالي عدد الصفوف في البيانات هو: ${totalRowCount.toLocaleString()} صف. يمكنك طرح أسئلتك الآن.`, "emerald");
}

async function askGemini() {
    const apiKeyInput = document.getElementById('api-key');
    const userInputField = document.getElementById('user-input');
    if(!apiKeyInput || !userInputField) return;

    const apiKey = apiKeyInput.value.trim();
    const userInput = userInputField.value.trim();

    if (!apiKey) {
        alert("الرجاء إدخال مفتاح الـ API Key أولاً!");
        return;
    }
    if (!userInput) return;

    appendMessage("أنت", userInput, "blue");
    userInputField.value = "";

    const loadingId = appendMessage("الذكاء الاصطناعي", "جاري التحليل والبحث في كامل البيانات...", "amber", true);

    const lines = globalDataSummary.trim().split('\n');
    const sampleData = lines.slice(0, 500).join('\n');

    const prompt = `
أنت خبير تحليل بيانات محترف ومساعد ذكي للتحليل.
ملاحظة هامة جداً: إجمالي عدد الصفوف الكلي الحقيقي الموجود في ملف البيانات هو: [ ${totalRowCount} صف ].
أسماء أعمدة الجدول المتاحة: [ ${globalColumns} ]

إليك عينة تمثيلية واسعة من أصل الـ ${totalRowCount} صف الخاصة بالبيانات:
${sampleData}

بناءً على تفاصيل ومعطيات البيانات وإجمالي الصفوف (${totalRowCount} صف)، أجِب عن سؤال المستخدم بدقة واحترافية وباللغة العربية:
${userInput}
    `;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error?.message || `خطأ في الاتصال (Code: ${response.status})`);
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، لم أتمكن من الحصول على رد.";
        updateMessage(loadingId, reply);
    } catch (error) {
        updateMessage(loadingId, "عذراً، حدث خطأ: " + error.message);
    }
}

function appendMessage(sender, text, color) {
    const chatContainer = document.getElementById('chat-container');
    if(!chatContainer) return '';
    const msgId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
    const align = sender === 'أنت' ? 'mr-auto bg-slate-700' : 'ml-auto bg-slate-800 border border-slate-700';
    
    const html = `
        <div id="${msgId}" class="p-3 rounded-xl max-w-[85%] ${align} mb-3 shadow">
            <p class="text-xs font-bold text-${color}-400 mb-1">${sender}</p>
            <p class="text-sm text-slate-200 whitespace-pre-wrap">${text}</p>
        </div>
    `;
    chatContainer.insertAdjacentHTML('beforeend', html);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return msgId;
}

function updateMessage(msgId, newText) {
    const msgElement = document.getElementById(msgId);
    if (msgElement) {
        const pTag = msgElement.querySelector('p.text-slate-200');
        if(pTag) pTag.textContent = newText;
    }
    const chatContainer = document.getElementById('chat-container');
    if(chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
}

document.querySelectorAll('.nb').forEach(b => b.onclick = () => switchPage(b.dataset.p));
renderUI();
</script>
